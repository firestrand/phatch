[tool.ruff.lint]
select = ["B", "C4", "E", "F", "I", "PERF", "RUF", "SIM", "UP", "W"]

[tool.ruff.lint.per-file-ignores]
"scripts/release_manifest.py" = ["E402"]
"scripts/verify.py" = ["E402"]
"tests/**/*.py" = ["S101"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.ty.environment]
python-version = "3.11"
extra-paths = ["."]

