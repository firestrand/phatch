[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "Phatch"
dynamic = ["version"]
description = "PHoto bATCH Processor"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "GPL-3.0-or-later"
license-files = ["COPYING"]
authors = [
    { name = "Stani", email = "spe.stani.be@gmail.com" },
]
maintainers = [
    { name = "Travis Silvers", email = "firestrand@gmail.com" },
]
keywords = ["batch", "image", "photo", "Pillow"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: MacOS X",
    "Environment :: Win32 (MS Windows)",
    "Environment :: X11 Applications",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics :: Graphics Conversion",
]
dependencies = [
    "Pillow>=11.3.0,<12",
    "platformdirs>=4.9.6,<5",
    "rich>=14.1.0",
]

[project.optional-dependencies]
gui = ["wxPython>=4.2.3"]
windows = ["pywin32>=311; sys_platform == 'win32'"]
metadata = ["pyexiv2>=2.8.0"]
heif = ["pillow-heif>=1.1.1"]
dev = [
    "build>=1.3.0",
    "coverage[toml]>=7.10.0",
    "packaging>=25.0",
    "pytest>=8.4.0",
    "pytest-cov>=7.0.0",
    "pyinstaller>=6.16.0,<7",
    "PyYAML>=6.0.2",
    "ruff>=0.14.0",
    "spdx-tools>=0.8.3",
    "twine>=6.2.0",
    "ty>=0.0.18",
]

[project.scripts]
phatch = "phatch.entrypoints:console_main"

[project.gui-scripts]
phatch-gui = "phatch.entrypoints:gui_main"

[project.urls]
Homepage = "https://github.com/firestrand/phatch"
Issues = "https://github.com/firestrand/phatch/issues"

[dependency-groups]
dev = [
    "build>=1.3.0",
    "coverage[toml]>=7.10.0",
    "packaging>=25.0",
    "pytest>=8.4.0",
    "pytest-cov>=7.0.0",
    "pyinstaller>=6.16.0,<7",
    "PyYAML>=6.0.2",
    "ruff>=0.14.0",
    "spdx-tools>=0.8.3",
    "twine>=6.2.0",
    "ty>=0.0.18",
]

[tool.setuptools.packages.find]
include = ["phatch*"]
namespaces = false

[tool.setuptools.dynamic]
version = { attr = "phatch.data.version.VERSION" }

[tool.setuptools.package-data]
phatch_assets = [
    "data/**/*",
    "docs/*",
    "docs/html/**/*",
    "images/**/*",
    "locale/**/*",
]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
target-version = "py311"
line-length = 88
builtins = ["_", "_t"]
