[tool.pytest.ini_options]
minversion = "8.4"
testpaths = ["tests"]
python_files = ["*_test.py", "test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
console_output_style = "progress"
addopts = ["-ra", "--strict-config", "--strict-markers", "--tb=short"]
markers = [
    "slow: marks tests as slow (deselect with '-m not slow')",
    "requires_display: marks tests that require a display/GUI",
    "requires_external: marks tests that require external tools",
    "acceptance: marks acceptance/integration tests",
    "unit: marks unit tests",
]
norecursedirs = [
    ".git",
    ".pytest_cache",
    "__pycache__",
    "*.egg-info",
    "build",
    "dist",
    ".venv",
    "venv",
]
doctest_optionflags = ["NORMALIZE_WHITESPACE", "ELLIPSIS"]

[tool.coverage.run]
source = ["phatch", "scripts"]
branch = true
relative_files = true

[tool.coverage.report]
fail_under = 90.0
precision = 2
show_missing = true
skip_empty = true

[tool.phatch]
verify-script = "scripts/verify.py"

[tool.phatch.coverage-ratchet]
line = 90.0
branch = 90.0
changed = 90.0
